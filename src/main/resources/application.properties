spring.application.name=pate-ponto-inteligente-web

spring.datasource.url=jdbc:mysql://localhost:3306/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

#JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update
# ==========================================
# CONFIGURAÇÕES DE HARDWARE (NFC E CÂMERA)
# ==========================================
# Deixe true no seu PC local; mude para false quando subir na VPS
# URL da API (use localhost:8080 nos testes locais ou o IP/domínio da sua VPS)
# Porta Serial do Arduino NFC
# Deixe true na máquina com a webcam/Arduino e false quando subir na VPS
ponto.hardware.enabled=true
ponto.api.base-url=http://localhost:8080/api
ponto.nfc.porta=COM3
ponto.nfc.baudrate=9600
ponto.camera.index=0
ponto.camera.exibir-janela=true

