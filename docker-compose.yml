version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bate-ponto-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydatabase}
      MYSQL_USER: ${MYSQL_USER:-myuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-verysecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app-network

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bate-ponto-spring
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mydatabase}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  face-recognition:
    build:
      context: ./vc-and-nfc
      dockerfile: vc/Dockerfile
    container_name: bate-ponto-face
    ports:
      - "5000:5000"
    environment:
      SPRING_BOOT_API_URL: http://spring-app:8080/api
      PONTO_LOCAL_ID: ${PONTO_LOCAL_ID:-1}
    volumes:
      - /dev/video0:/dev/video0
    devices:
      - /dev/video0:/dev/video0
    privileged: true
    depends_on:
      - spring-app
    networks:
      - app-network
    restart: unless-stopped

  arduino-nfc:
    build:
      context: ./arduino
      dockerfile: Dockerfile
    container_name: bate-ponto-nfc
    environment:
      SPRING_BOOT_API_URL: http://spring-app:8080/api
    devices:
      - ${ARDUINO_PORT:-/dev/ttyUSB0}:${ARDUINO_PORT:-/dev/ttyUSB0}
    privileged: true
    depends_on:
      - spring-app
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
